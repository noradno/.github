name: SonarQube Scan Reusable Workflow

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: 'A token to authenticate with SonarQube'
        required: true

permissions:
  contents: read

jobs:
  analyze:
    timeout-minutes: 30
    name: Analyze code with SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}