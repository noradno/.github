name: Publish to GitHub Packages Reusable Workflow

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to use'
        required: false
        type: string
        default: '9.0.x'
      package-name:
        description: 'The name of the package'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Packages published by other noradno repos (e.g. Norad.GranMa.Core) live on GitHub Packages.
      # A bare `dotnet restore` has no credentials for that feed and fails with 401, so authenticate the
      # source with the job token first. Repos that already declare the source in nuget.config get it
      # updated in place; repos without one get it added. The consuming repo must also be granted
      # read access on each package it restores (package settings -> Manage Actions access).
      - name: Authenticate GitHub Packages NuGet source
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if dotnet nuget list source | grep -q "github-noradno"; then
            dotnet nuget update source github-noradno --username "${{ github.actor }}" --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          else
            dotnet nuget add source "https://nuget.pkg.github.com/noradno/index.json" --name github-noradno --username "${{ github.actor }}" --password "$NUGET_AUTH_TOKEN" --store-password-in-clear-text
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Pack NuGet package
        run: dotnet pack --configuration Release --output ./artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

      - name: Push to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          dotnet nuget push "./artifacts/${{ env.PACKAGE_NAME }}.*.nupkg" --source "https://nuget.pkg.github.com/noradno/index.json" --api-key "${{ env.NUGET_AUTH_TOKEN }}" --skip-duplicate